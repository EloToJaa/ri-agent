[workspace]
members = ["crates/cli", "crates/tui", "crates/lua"]
default-members = [".", "crates/cli", "crates/tui", "crates/lua"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "ri-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ri-agent-lua = { path = "crates/lua" }
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "time", "sync"] }
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
