image: nixos/nix:2.31.2

stages:
  - format
  - build
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  NIX_CONFIG: "experimental-features = nix-command flakes"

default:
  cache:
    key:
      files:
        - Cargo.lock
        - flake.lock
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/
      - target/
  before_script:
    - nix --version

format-check:
  stage: format
  script:
    - nix build ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).formatting" --no-link

build:
  stage: build
  script:
    - nix develop --command cargo build --workspace --locked

unit-tests:
  stage: test
  script:
    - nix develop --command cargo test --workspace --locked
