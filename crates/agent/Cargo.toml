[package]
name = "ri-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ri-agent-lua = { path = "../lua" }
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "time", "sync"] }
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
