[package]
name = "ri-agent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "codecrafters-claude-code"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ri-agent = { path = "../.." }
ri-agent-tui = { path = "../tui" }
anyhow = "1"
clap = { version = "4.3.14", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"
