[package]
name = "ri-agent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ri"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ri-agent = { path = "../agent" }
ri-agent-tui = { path = "../tui" }
anyhow = "1"
base64 = "0.22"
rand = "0.9"
rpassword = "7"
sha2 = "0.10"
urlencoding = "2"
url = "2"
clap = { version = "4.3.14", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"
